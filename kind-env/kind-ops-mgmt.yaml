kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ops-mgmt
networking:
  apiServerAddress: "127.0.0.1"
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "node-role=infra"
  extraPortMappings:
  - containerPort: 30080
    hostPort: 30080
    protocol: TCP
  - containerPort: 30443
    hostPort: 30443
    protocol: TCP
- role: worker
  labels:
    node-role: infra
- role: worker
  labels:
    node-role: infra
- role: worker
  labels:
    node-role: infra
