global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity', 'namespace']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'feishu-webhook'
  routes:
    - match:
        severity: critical
      receiver: 'feishu-webhook'
      group_wait: 0s
    - match:
        severity: warning
      receiver: 'feishu-webhook'
      continue: true

receivers:
  - name: 'feishu-webhook'
    webhook_configs:
      - url: 'http://feishu-notifier.monitoring/send'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'namespace']
