# Mimir 分布式（长期指标存储）
# 替代 Thanos/Cortex，运维更简单
mimir:
  storage:
    backend: s3
    s3:
      endpoint: minio.minio.svc.cluster.local:9000
      bucket_name: mimir-data
      access_key_id: minio
      secret_access_key: minio123
      insecure: true
  schema:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: s3
        schema: v13
  limits:
    ingestion_rate: 100000
    ingestion_burst_size: 200000
    max_global_series_per_user: 1000000
    retention_period: 365d  # 1 年
  blocks_storage:
    tsdb:
      dir: /data/tsdb
    bucket_store:
      sync_dir: /data/bucket-store
  common:
    storage:
      s3:
        http:
          idle_conn_timeout: 90s
          response_header_timeout: 2m
        trace_enabled: false

# 组件副本数
distributor:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

ingester:
  replicas: 3
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 4Gi

querier:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2Gi

queryFrontend:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi

storeGateway:
  replicas: 2
  persistence:
    enabled: true
    size: 50Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 4Gi

compactor:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Gateway（入口）
gateway:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Alertmanager URL
alertmanager:
  external_url: http://alertmanager-operated.monitoring.svc.cluster.local:9093

# ServiceMonitor
serviceMonitor:
  enabled: true
