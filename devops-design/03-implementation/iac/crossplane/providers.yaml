# Crossplane Providers: 让 Crossplane 能调用 AWS API
# 安装顺序：先装 provider-aws（核心），再装子 provider（按需）
# 凭据：所有 Provider 共享同一个 ProviderConfig，引用同一份 AWS credentials Secret
# 部署方式：kubectl apply -f providers.yaml
# 健康检查：kubectl get providers; status 应为 Healthy

# ===== 0. 凭据 Secret（提前创建）=====
# kubectl create secret generic aws-credentials -n crossplane-system \
#   --from-file=credentials=~/.aws/credentials
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
type: Opaque
stringData:
  # 格式同 AWS CLI credentials 文件
  # 平台账号使用 IAM Role 而非长 Key 是更安全做法（IRSA / Karpenter）
  # 此处为开发环境示意，生产请用 IRSA
  credentials: |
    [default]
    aws_access_key_id = REPLACE_ME
    aws_secret_access_key = REPLACE_ME

---
# ===== 1. 共享 ProviderConfig =====
# 所有 AWS 子 provider 都通过 provider-aws 的配置访问 AWS
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: aws-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-credentials
      key: credentials

---
# ===== 2. provider-aws 核心 =====
# 必备：所有子 provider 依赖它
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  package: xpkg.upbound.io/upbound/provider-aws:v0.47.0
  controllerConfigRef:
    name: provider-aws-config
---
apiVersion: pkg.crossplane.io/v1alpha1
kind: ControllerConfig
metadata:
  name: provider-aws-config
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  args:
    - --enable-management-policies
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

---
# ===== 3. provider-aws-rds（RDS 资源）=====
# 用于 XPostgresDatabase Composition
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-rds
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  package: xpkg.upbound.io/upbound/provider-aws-rds:v1.0.0

---
# ===== 4. provider-aws-elasticache（ElastiCache 资源）=====
# 用于 XRedisCluster Composition
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-elasticache
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  package: xpkg.upbound.io/upbound/provider-aws-elasticache:v1.0.0

---
# ===== 5. provider-aws-s3（S3 资源）=====
# 用于 XBucket Composition
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-s3
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  package: xpkg.upbound.io/upbound/provider-aws-s3:v1.0.0

---
# ===== 6. provider-aws-mq（Amazon MQ 资源）=====
# 用于 XRabbitMQCluster Composition（Amazon MQ 提供托管 RabbitMQ）
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-mq
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  package: xpkg.upbound.io/upbound/provider-aws-mq:v1.0.0

---
# ===== 7. provider-helm（可选：自管中间件）=====
# 如果某些中间件不想用 AWS 托管（如自管 RabbitMQ Operator），
# 可以用 helm provider 部署 Bitnami RabbitMQ chart
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-helm
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-helm:v0.18.0

---
# ===== 8. provider-kubernetes（可选：直接管理 K8s 资源）=====
# 用于 XKubernetesAddon（应用层服务网格/Istio 等 addon 自助）
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v0.13.0
