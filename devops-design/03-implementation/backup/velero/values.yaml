# Velero Helm values
# 备份业务 namespace + 平台关键数据
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: opshub-velero-backups
      config:
        region: minio
        s3ForcePathStyle: true
        s3Url: http://minio.minio.svc.cluster.local:9000
        publicUrl: http://minio.minio.svc.cluster.local:9000
      credential:
        name: velero-credentials
        key: cloud
  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: minio
        s3ForcePathStyle: true
        s3Url: http://minio.minio.svc.cluster.local:9000
  # 后端用 restic（增量、跨云一致）
  restic:
    enable: true
    # 哪些 namespace 用 restic
    namespace: velero
  features: |
    EnableCSI: true

credentials:
  existingSecret: velero-credentials

# 资源
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# 多副本
deployRestic: true
replicaCount: 2

# Init container 用 AWS CLI 配置 MinIO
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.10.0
    volumeMounts:
      - mountPath: /target
        name: plugins

# Metric 暴露
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus
