# kind 集群配置：ops-mgmt (平台管理集群)
# 用途：运行 ArgoCD、Keycloak、监控栈、备份、混沌等平台组件
# 节点：1 control-plane + 3 worker（混合角色，模拟生产 HA）
---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ops-mgmt
networking:
  # Pod CIDR 必须与业务集群不同，避免 Submariner GlobalNet 复杂性
  podSubnet: "10.100.0.0/16"
  serviceSubnet: "10.200.0.0/16"
  # 禁用默认 CNI 以外的限制
  disableDefaultCNI: false
  # kubeProxyMode: ipvs  # 在生产用 ipvs 性能更好；kind 默认 iptables 即可
nodes:
  # Control plane 节点
  - role: control-plane
    image: kindest/node:v1.30.0
    extraPortMappings:
      # ArgoCD / Grafana / Keycloak 端口映射到宿主机
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
    extraMounts:
      # 共享 Docker socket 用于 kind 内部构建（可选）
      - hostPath: /var/run/docker.sock
        containerPath: /var/run/docker.sock
        readOnly: true
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
  # Worker 节点 1：平台组件
  - role: worker
    image: kindest/node:v1.30.0
    extraMounts:
      - hostPath: /var/run/docker.sock
        containerPath: /var/run/docker.sock
        readOnly: true
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=platform,zone=az-a"
  # Worker 节点 2：监控组件
  - role: worker
    image: kindest/node:v1.30.0
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=monitoring,zone=az-b"
  # Worker 节点 3：备份 / 混沌组件
  - role: worker
    image: kindest/node:v1.30.0
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=backup,zone=az-c"
# 容器运行时优化
# 注：K8s 1.30+ 已移除 GatewayAPI feature gate，GA 版本默认开启
# runtimeConfig:
#   # 启用所有 alpha features（仅 PoC；生产按需）
#   # 注意：kind 默认是稳定的 runtime config
# featureGates:
#   # K8s 1.30 已移除 GatewayAPI 开关
#   # "GatewayAPI": true
