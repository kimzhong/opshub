apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-kube-prometheus-grafana-datasource
  namespace: monitoring
  labels:
    app: kube-prometheus-stack-grafana
    app.kubernetes.io/component: grafana
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kube-prometheus-stack
    app.kubernetes.io/version: 91.7.0
    chart: kube-prometheus-stack-91.7.0
    grafana_datasource: "1"
    heritage: Helm
    release: prometheus
data:
  # key 名必须是 datasource.yaml（单数）—— 这是 kube-prometheus-stack 约定的文件名，
  # 侧车 grafana-sc-datasources 会把该 ConfigMap 的每个 key 原样拷进
  # /etc/grafana/provisioning/datasources/，Grafana 会读取目录下的所有 yaml。
  # 之前误用 datasources.yaml（复数）导致同一份 Prometheus 数据源被定义两遍、
  # 两个都标了 isDefault: true，Grafana 直接起不来：
  #   "Only one datasource per organization can be marked as default"
  datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: "Prometheus"
      type: prometheus
      uid: prometheus
      url: http://prometheus-kube-prometheus-prometheus.monitoring:9090/
      access: proxy
      isDefault: true
      jsonData:
        httpMethod: POST
        timeInterval: 30s
    - name: "Alertmanager"
      type: alertmanager
      uid: alertmanager
      url: http://prometheus-kube-prometheus-alertmanager.monitoring:9093/
      access: proxy
      jsonData:
        handleGrafanaManagedAlerts: false
        implementation: prometheus
    # Loki 多租户必须带 X-Scope-OrgID 租户头，否则查询返回空
    # 集群内端口是 80（Service 端口），8080 只是 Pod 容器端口
    - name: "Loki"
      type: loki
      uid: loki
      url: http://loki-gateway.logging.svc.cluster.local:80/
      access: proxy
      jsonData:
        maxLines: 1000
        timeout: 60
        httpHeaderName1: X-Scope-OrgID
      secureJsonData:
        httpHeaderValue1: foo
