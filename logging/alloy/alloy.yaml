apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: logging
  labels:
    app.kubernetes.io/name: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  # loki.source.kubernetes 通过 pods/log 子资源读取日志内容，缺这条会一直
  # 报 "cannot get resource pods/log" 而静默不采集
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: logging
  labels:
    app.kubernetes.io/name: alloy
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    // 采集所有 Pod 日志，按业务命名空间过滤
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      // 只采集业务与可观测相关的命名空间，避免把 kube-system 噪声灌进 Loki
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "demo-app|logging|monitoring|argocd"
        action        = "keep"
      }

      // __meta_ 前缀的标签在 relabel 之后会被丢弃，这里复制成普通标签，
      // Loki 3.x 下它们才会作为流标签入库，Grafana 里才能写 {namespace="demo-app"}
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }

      // 注意：不要加基于 __meta_kubernetes_pod_container_init 的 drop 规则。
      // 在 Alloy v1.20 上那条规则会让 loki.source.kubernetes 拿不到任何 target，
      // 表现为「配置加载成功、无报错、但一条日志都采不到」。
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url       = "http://loki-gateway.logging.svc.cluster.local:80/loki/api/v1/push"
        tenant_id = "foo"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: logging
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/component: agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "12345"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: alloy
      # emptyDir 默认属主是 root，Alloy 以 65534 运行，需要 fsGroup 授权才能写 /var/lib/alloy
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      tolerations:
        - operator: Exists
      containers:
        - name: alloy
          image: docker.io/grafana/alloy:latest
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http-metrics
              containerPort: 12345
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy
            - name: tmp
              mountPath: /tmp
            # loki.source.kubernetes 按 pod 元数据拼接 /var/log/pods 路径读日志，
            # 不挂载宿主机日志目录就只能发现元数据、读不到任何文件
            - name: varlog
              mountPath: /var/log
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alloy
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - logging
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
